# Checks a pull request's entries with the latest DRH Launcher. Runs on
# `pull_request`: a read-only token and no secret, whoever opened it.
name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      # The repository variable DRHL_VERSION picks a launcher release (a
      # pre-release to test one); empty, the latest.
      - name: Download DRH Launcher
        env:
          GH_TOKEN: ${{ github.token }}
          DRHL_VERSION: ${{ vars.DRHL_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download $DRHL_VERSION --repo Tutez64/DRH-Launcher --pattern '*.AppImage' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          mv ./*.AppImage drhl.AppImage
          chmod +x drhl.AppImage
          # The launcher links fontconfig even without its window.
          ldconfig -p | grep -q libfontconfig.so.1 || { sudo apt-get update && sudo apt-get install -y libfontconfig1; }

      - name: Check the entries
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REPORT: ${{ runner.temp }}/report/report.md
        run: python3 .github/scripts/check_pull_request.py "$RUNNER_TEMP/drhl.AppImage" "$BASE_SHA"

      # For the Comment workflow, which posts it on the pull request: this run cannot.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report
          path: ${{ runner.temp }}/report/report.md
          if-no-files-found: ignore
          retention-days: 7
