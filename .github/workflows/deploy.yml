# Generates index.json from the entries and deploys it to GitHub Pages.
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download DRH Launcher
        env:
          GH_TOKEN: ${{ github.token }}
          DRHL_VERSION: ${{ vars.DRHL_VERSION }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download $DRHL_VERSION --repo Tutez64/DRH-Launcher --pattern '*.AppImage' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          mv ./*.AppImage drhl.AppImage
          chmod +x drhl.AppImage
          # The launcher links fontconfig even without its window.
          ldconfig -p | grep -q libfontconfig.so.1 || { sudo apt-get update && sudo apt-get install -y libfontconfig1; }

      - name: Generate index.json
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: '"$RUNNER_TEMP/drhl.AppImage" --build-index . _site/index.json'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
